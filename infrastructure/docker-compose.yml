services:
  # 1. QUẢN LÝ LUỒNG (KAFKA & ZOOKEEPER)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: uet-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    deploy:
      resources:
        limits:
          memory: 256M
 
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: uet-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"  
    deploy:
      resources:
        limits:
          memory: 1G

  # TẠO KAFKA TOPIC TỰ ĐỘNG VỚI 3 PARTITION
  kafka-topic-creator:
    image: confluentinc/cp-kafka:7.4.0
    container_name: uet-kafka-topic-creator
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "⏳ Đang chờ Kafka sẵn sàng..."
        cub kafka-ready -b kafka:29092 1 60
        echo " Kafka đã sẵn sàng!"

        kafka-topics --create \
          --topic tour_events \
          --bootstrap-server kafka:29092 \
          --partitions 3 \
          --replication-factor 1 \
          --if-not-exists

        echo " Hoàn tất!"
        kafka-topics --describe \
          --topic tour_events \
          --bootstrap-server kafka:29092
    deploy:
      resources:
        limits:
          memory: 256M

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: uet-kafka-ui
    depends_on:
      - kafka-topic-creator
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    deploy:
      resources:
        limits:
          memory: 256M
 
  # 2. LƯU TRỮ LẠNH (MINIO - S3 OPEN SOURCE)
  minio:
    image: minio/minio
    container_name: uet-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          memory: 512M
 
  # 3. KHO PHÂN TÍCH NÓNG (CLICKHOUSE & METABASE)
  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: uet-clickhouse
    ports:
      - "8123:8123"
      - "19000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    deploy:
      resources:
        limits:
          memory: 2G
 
  metabase:
    image: metabase/metabase:latest
    container_name: uet-metabase
    ports:
      - "3000:3000"
    volumes:
      - metabase_data:/metabase-data
    environment:                
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_OPTS: "-Xmx512m -Xms256m"
    deploy:
      resources:
        limits:
          memory: 1G
 
volumes:
  clickhouse_data:
  metabase_data:
 
networks:
  default:
    name: uet-data-network